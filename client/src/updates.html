<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060a13" />
    <title>CKTV · 更新中心</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/pages.css" />
    <script type="module" src="./js/updates.js"></script>
  </head>
  <body>
    <div id="app" class="updates">
      <!-- 桌面端：自绘标题栏（窗口没有系统边框），可以拖动，右上角是窗口按钮 -->
      <header class="titlebar" id="titlebar" data-tauri-drag-region hidden>
        <div class="tb-brand" data-tauri-drag-region>
          <img src="./assets/logo.svg" alt="" width="18" height="18" />
          <span data-tauri-drag-region>CKTV · 更新中心</span>
        </div>
        <div class="tb-controls">
          <button
            class="tb-btn"
            id="tb-min"
            type="button"
            aria-label="最小化"
          ></button>
          <button
            class="tb-btn tb-close"
            id="tb-close"
            type="button"
            aria-label="关闭"
          ></button>
        </div>
      </header>

      <!-- 手机端：顶部返回栏 -->
      <header class="topbar" id="topbar" hidden>
        <button
          class="btn btn-ghost btn-icon"
          id="back"
          type="button"
          aria-label="返回"
        ></button>
        <span class="topbar-title">更新中心</span>
        <span class="topbar-spacer"></span>
      </header>

      <main class="shell" id="shell">
        <section class="hero card" id="hero" aria-live="polite"></section>

        <div class="tabs-row">
          <div class="segmented" role="tablist" aria-label="更新中心">
            <button
              type="button"
              role="tab"
              id="tab-update"
              aria-controls="panel-update"
              aria-selected="true"
              data-tab="update"
            >
              更新
            </button>
            <button
              type="button"
              role="tab"
              id="tab-servers"
              aria-controls="panel-servers"
              aria-selected="false"
              data-tab="servers"
              tabindex="-1"
            >
              线路
            </button>
            <button
              type="button"
              role="tab"
              id="tab-about"
              aria-controls="panel-about"
              aria-selected="false"
              data-tab="about"
              tabindex="-1"
            >
              关于
            </button>
          </div>
        </div>

        <section
          id="panel-update"
          role="tabpanel"
          aria-labelledby="tab-update"
        ></section>
        <section
          id="panel-servers"
          role="tabpanel"
          aria-labelledby="tab-servers"
          hidden
        ></section>
        <section
          id="panel-about"
          role="tabpanel"
          aria-labelledby="tab-about"
          hidden
        ></section>
      </main>
    </div>
  </body>
</html>
