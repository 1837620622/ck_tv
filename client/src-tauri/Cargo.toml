[package]
name = "cktv-app"
version = "1.2.3"
description = "CKTV 传康播放器客户端"
authors = ["CKTV"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "cktv_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
semver = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "fs", "io-util"] }
futures-util = "0.3"
# HLS 分片解密：AES-128-CBC，与 hls 模块的 decrypt_aes128 配合
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
log = "0.4"
# 证书：Android 上 reqwest 用内置根证书（见 src/http.rs），不依赖需要 JNI 初始化的系统校验器
rustls = "0.23"
webpki-roots = "1"

# 桌面端：窗口状态记忆、单实例
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
