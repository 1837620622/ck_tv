name: App Release

# 推送 app-v<版本号> 标签时构建并发布 CKTV 客户端（版本号和标签的写法见 client/README.md）。不需要配置任何密钥。
#
#   1. verify   检查版本号和标签一致、并且比上一个正式发布大，创建草稿 Release（注释标签用它的注释作更新说明，轻量标签用默认文案）
#   2. desktop  macOS（通用版）、Windows、Linux：构建安装包，上传到草稿
#   3. android  构建 APK，使用仓库里公开的签名密钥（client/signing/），上传到草稿
#   4. ios      构建未签名的 IPA，用户通过 AltStore 用自己的 Apple ID 安装，上传到草稿
#   5. publish  生成 update.json 和 altstore.json，上传后把 Release 改为正式发布
#
# 可选的仓库变量 CN_MIRROR_BASE：国内下载线路的根地址，例如
#   https://tv.chuankangkk.top/cktv
# 发布时会自动加上 /app-v<版本号>/，所以变量只需要设置一次。
# 必须是白名单里的域名（见 client/scripts/make-update-manifest.mjs）。没有设置时，
# 应用只提供 GitHub 下载线路。
# pnpm 版本由根目录 package.json 的 packageManager 决定，这里不要再写 version（两边都写，pnpm/action-setup 会直接报错）。

on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: 检查版本号并创建草稿 Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 取回标签注释（更新说明）
        run: |
          # checkout 不一定会带上标签对象，所以明确取回。
          # 注释标签的注释作为更新说明；轻量标签（网页创建发布时就是轻量标签）没有注释，
          # 后面的步骤改用默认文案。不能直接用 %(contents)：对轻量标签它返回的是提交信息。
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          case "$(git for-each-ref --format='%(objecttype)' "refs/tags/$GITHUB_REF_NAME")" in
            tag) echo "注释标签 $GITHUB_REF_NAME：更新说明用标签注释" ;;
            commit) echo "轻量标签 $GITHUB_REF_NAME，没有注释，更新说明用默认文案" ;;
            *) echo "取不到标签 $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

      - name: 运行脚本和纯函数的测试
        run: node --test "client/test/*.test.mjs"

      - name: 检查版本号：和标签一致，并且比上一个正式发布大
        run: |
          # 应用内更新只会安装比当前版本大的版本号。版本号倒退或没有变化，老用户就收不到更新。
          # 重新运行同一个标签的发布时，最新的正式发布就是它自己，不再和自己比较。
          # 查询失败（不是「没有正式发布」）时直接失败，不能悄悄跳过检查
          if LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/gh-error.txt"); then
            true
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/gh-error.txt"; then
            LATEST=""
          else
            cat "$RUNNER_TEMP/gh-error.txt" >&2
            exit 1
          fi
          echo "上一个正式发布：${LATEST:-（没有）}"
          if [ -z "$LATEST" ] || [ "$LATEST" = "$GITHUB_REF_NAME" ]; then
            node client/scripts/sync-version.mjs --check --tag "$GITHUB_REF_NAME"
          else
            node client/scripts/sync-version.mjs --check --tag "$GITHUB_REF_NAME" --after "$LATEST"
          fi

      - name: 创建草稿 Release（已经存在就沿用）
        run: |
          # 列表接口会包含草稿，按标签名直接查询则不会，所以这里用列表判断
          if gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' | grep -Fxq "$GITHUB_REF_NAME"; then
            echo "Release $GITHUB_REF_NAME 已经存在，沿用它"
            exit 0
          fi
          # 只有注释标签才有标签注释；轻量标签没有，用默认文案
          NOTES="$RUNNER_TEMP/notes.md"
          : > "$NOTES"
          if [ "$(git for-each-ref --format='%(objecttype)' "refs/tags/$GITHUB_REF_NAME")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then
            echo "CKTV 客户端 $GITHUB_REF_NAME" > "$NOTES"
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "CKTV $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  desktop:
    name: 桌面端 · ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS（通用版）
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            runner: windows-latest
            rust-targets: ''
            args: ''
          - name: Linux
            runner: ubuntu-22.04
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建安装包并上传到草稿 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: CKTV ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

  android:
    name: 安卓 APK
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NDK_VERSION: 27.0.12077973
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 运行器镜像已经自带 Android SDK，不用 android-actions/setup-android：它会去安装已经废弃的 tools 包，
      # 在这里报错退出。这一步只补装 NDK。
      - name: 安装 NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # cmdline-tools 的版本目录名不固定（latest、16.0 等），所以按文件查找
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -path '*/bin/*' | sort | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager，目录：$SDK/cmdline-tools" >&2
            exit 1
          fi
          # sdkmanager 退出后 yes 会收到 SIGPIPE；流水线开启了 pipefail，所以 yes 失败时用 || true 兜住
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          (yes || true) | "$SDKMANAGER" --install "ndk;${NDK_VERSION}" > /dev/null
          NDK_DIR="$SDK/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_DIR" ]; then
            echo "NDK 没有装好：$NDK_DIR" >&2
            exit 1
          fi
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "NDK_HOME=$NDK_DIR"
            echo "ANDROID_NDK_HOME=$NDK_DIR"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 写入签名配置
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # 没有配置私钥时，使用仓库里公开的签名密钥（见 client/README.md）。
          # 每个版本都用同一个密钥签名，用户才能覆盖安装。
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            STORE_FILE="$RUNNER_TEMP/release.jks"
            PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            ALIAS="$ANDROID_KEY_ALIAS"
          else
            STORE_FILE="$GITHUB_WORKSPACE/client/signing/cktv-android-public.jks"
            PASSWORD="cktv-public"
            ALIAS="cktv"
          fi
          {
            echo "password=$PASSWORD"
            echo "storePassword=$PASSWORD"
            echo "keyPassword=$PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "storeFile=$STORE_FILE"
          } > src-tauri/gen/android/keystore.properties
          # Tauri 生成的 Gradle 脚本按模块目录解析 keystore.properties，只写在 gen/android/ 会被当成不存在而出未签名包；
          # 同时写到 gen/android/app/（build.gradle.kts 所在目录），两种模板都能读到。
          cp src-tauri/gen/android/keystore.properties src-tauri/gen/android/app/keystore.properties

      - name: 构建 APK
        run: pnpm tauri android build --apk

      - name: 签名并上传 APK 到草稿 Release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Tauri 生成的 Gradle 工程默认没有 signingConfigs，keystore.properties 写了也不会被读，
          # 所以构建产物恒为未签名包；这里用 apksigner 对未签名包事后签名，再上传。
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            STORE_FILE="$RUNNER_TEMP/release.jks"
            PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            ALIAS="$ANDROID_KEY_ALIAS"
          else
            STORE_FILE="$GITHUB_WORKSPACE/client/signing/cktv-android-public.jks"
            PASSWORD="cktv-public"
            ALIAS="cktv"
          fi
          UNSIGNED=$(find src-tauri/gen/android -name 'app-universal-release-unsigned.apk' | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            echo "没有找到未签名 APK" >&2
            find src-tauri/gen/android -name '*.apk' >&2 || true
            exit 1
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK"/build-tools -name apksigner -type f | sort | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "找不到 apksigner" >&2
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          SIGNED="$RUNNER_TEMP/CKTV_${VERSION}_android.apk"
          "$APKSIGNER" sign --ks "$STORE_FILE" --ks-pass "pass:$PASSWORD" --ks-key-alias "$ALIAS" --key-pass "pass:$PASSWORD" --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"
          gh release upload "$GITHUB_REF_NAME" "$SIGNED" --clobber          
              
  ios:
    name: iPhone / iPad（未签名 IPA）
    needs: verify
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 iOS 工程
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          pnpm tauri ios init --ci

      # Rust 编译时会把 dist/ 打包进程序，所以先构建界面
      - name: 构建界面（供 Rust 编译使用）
        run: pnpm build

      # 用 Tauri 自己的命令构建：Xcode 构建时需要连接 CLI 启动的本地选项服务
      #（gen/apple/.tauri/cli-options-server.json），直接调用 xcodebuild 会因为缺少它失败。
      # --no-sign：不签名。IPA 由用户在 AltStore 里用自己的 Apple ID 重新签名后安装。
      # 只构建真机架构（aarch64），与上面安装的 Rust 目标一致。
      - name: 构建未签名的 IPA
        run: pnpm tauri ios build --ci --no-sign --target aarch64

      - name: 上传 IPA 到草稿 Release
        run: |
          # IPA 的输出目录由 Tauri 决定，所以按文件名查找，不写死路径
          IPA_SRC=$(find src-tauri/gen/apple -name '*.ipa' | head -n 1)
          if [ -z "$IPA_SRC" ]; then
            echo "没有找到 IPA" >&2
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          IPA="$RUNNER_TEMP/CKTV_${VERSION}_ios-unsigned.ipa"
          cp "$IPA_SRC" "$IPA"
          gh release upload "$GITHUB_REF_NAME" "$IPA" --clobber

  publish:
    name: 生成更新清单并正式发布
    needs: [verify, desktop, android, ios]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CN_MIRROR_BASE: ${{ vars.CN_MIRROR_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载五个平台的安装包
        run: |
          mkdir -p "$RUNNER_TEMP/downloads"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/downloads" --clobber \
            --pattern '*.dmg' --pattern '*-setup.exe' --pattern '*.AppImage' --pattern '*.apk' --pattern '*.ipa'
          ls -la "$RUNNER_TEMP/downloads"

      - name: 生成 update.json、altstore.json 和图标
        run: |
          VERSION=$(node -p "require('./client/package.json').version")
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          # 只有注释标签才有标签注释；轻量标签没有，用默认文案
          NOTES="$RUNNER_TEMP/notes.md"
          : > "$NOTES"
          if [ "$(git for-each-ref --format='%(objecttype)' "refs/tags/$GITHUB_REF_NAME")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then
            echo "CKTV 客户端 $GITHUB_REF_NAME" > "$NOTES"
          fi
          ARGS=(
            --version "$VERSION"
            --tag "$GITHUB_REF_NAME"
            --repo "$GITHUB_REPOSITORY"
            --assets-dir "$RUNNER_TEMP/downloads"
            --icon client/src-tauri/icons/icon.png
            --out-dir "$RUNNER_TEMP/manifest"
            --notes-file "$RUNNER_TEMP/notes.md"
          )
          if [ -n "$CN_MIRROR_BASE" ]; then
            # 变量是根地址，每个版本放在 app-v<版本号> 目录下，这里自动加上标签
            ARGS+=(--mirror-base "${CN_MIRROR_BASE%/}/$GITHUB_REF_NAME")
          fi
          node client/scripts/make-update-manifest.mjs "${ARGS[@]}"

      - name: 上传清单并把 Release 改为正式发布
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/manifest/update.json" \
            "$RUNNER_TEMP/manifest/altstore.json" \
            "$RUNNER_TEMP/manifest/cktv-icon.png" \
            --clobber
          # 更新说明：标签注释 + 下载表格（每个平台的文件名和下载地址）
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest \
            --notes-file "$RUNNER_TEMP/manifest/release-notes.md"
