name: App Release


# 推送 app-v<版本号> 标签时构建并发布 CKTV 客户端（版本号和标签的写法见 client/README.md）。不需要配置任何密钥。
#
#   1. verify   检查版本号和标签一致、并且比上一个正式发布大，创建草稿 Release（注释标签用它的注释作更新说明，轻量标签用默认文案）
#   2. desktop  macOS（通用版）、Windows、Linux：构建安装包，上传到草稿
#   3. android  构建 APK，使用仓库里公开的签名密钥（client/signing/），上传到草稿
#   4. ios      构建未签名的 IPA，用户通过 AltStore 用自己的 Apple ID 安装，上传到草稿
#   5. publish  生成 update.json 和 altstore.json，上传后把 Release 改为正式发布
# 可选的仓库变量 CN_MIRROR_BASE：国内下载线路的根地址，例如
#   https://tv.chuankangkk.top/cktv
# 发布时会自动加上 /app-v<版本号>/，所以变量只需要设置一次。
# 必须是白名单里的域名（见 client/scripts/make-update-manifest.mjs）。没有设置时，
# 应用只提供 GitHub 下载线路。
on:
  push:
    tags:
      - 'app-v*'
permissions:
  contents: write
concurrency:
  group: app-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: 检查版本号并创建草稿 Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 取回标签注释（更新说明）
        run: |
          # checkout 不一定会带上注释标签的内容，所以明确取回。
          # 注释标签用它的注释作更新说明；轻量标签（网页创建发布时就是轻量标签）
          # 没有注释，更新说明用默认文案，不再直接失败，后续步骤已有兜底。
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]; then
            echo "轻量标签 $GITHUB_REF_NAME，没有注释，更新说明用默认文案"
          fi
      - name: 同步版本并运行脚本和纯函数的测试
        run: |
          # 版本号的唯一来源是标签。提交里改版本号时必须同步多个文件里的版本（和
          # client/src-tauri/tauri.conf.json 里的版本），所以这一步只跑脚本，不检查
          # package.json 和标签是否一致。如果脚本发现不一致，会自动修正这些文件，
          # 然后提交回标签所在的分支……但标签发布时没有分支，这一步只负责测试。
          # 实际发布的版本号来自标签，脚本会把所有文件里的版本号都改成标签里的版本。
          node client/scripts/sync-version.mjs "$GITHUB_REF_NAME"
          node --test "client/test/*.test.mjs"
      - name: 检查版本号：和标签一致，并且比上一个正式发布大
        run: |
          # 应用内更新只会安装比当前版本大的版本号。版本号倒退或没有变化，老用户就收不到更新。
          # 重新运行同一个标签的发布时，最新的正式发布就是它自己，不再和自己比较。
          # 查询失败（不是「没有正式发布」）时直接失败，不能悄悄跳过检查
          if LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/gh-error.txt"); then
            true
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/gh-error.txt"; then
            LATEST=""
          else
            cat "$RUNNER_TEMP/gh-error.txt" >&2
            echo "查询最新正式发布失败" >&2
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          echo "当前标签：$GITHUB_REF_NAME，package.json 版本：$VERSION"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "package.json 的 version（$VERSION）和标签（$GITHUB_REF_NAME）不一致" >&2
            exit 1
          fi
          if [ -n "$LATEST" ] && [ "$LATEST" != "$GITHUB_REF_NAME" ]; then
            LATEST_VERSION="${LATEST#app-v}"
            HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST_VERSION" | sort -V | tail -n 1)
            if [ "$HIGHEST" != "$VERSION" ] || [ "$VERSION" = "$LATEST_VERSION" ]; then
              echo "版本号 $VERSION 没有比上一个正式发布 $LATEST 大" >&2
              exit 1
            fi
          fi
      - name: 从标签注释或默认文案生成更新说明
        run: |
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          fi
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          CKTV 客户端更新。
          EOF
          fi
      - name: 创建草稿 Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "CKTV $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA"
  desktop:
    name: 桌面端 · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: verify
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            rust-targets: universal-apple-darwin
            args: ''
          - name: Windows
            runner: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: ''
          - name: Linux
            runner: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装系统依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 安装依赖并构建安装包
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --target ${{ matrix.rust-targets }} ${{ matrix.args }}
      - name: 上传安装包到草稿 Release
        run: |
          ls client/src-tauri/target/${{ matrix.rust-targets }}/release/bundle/
          find client/src-tauri/target/${{ matrix.rust-targets }}/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print -exec gh release upload "$GITHUB_REF_NAME" {} --clobber \;
  android:
    name: 安卓构建
    runs-on: ubuntu-latest
    needs: verify
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: 安装 NDK（用 runner 自带的 Android SDK）
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "Android SDK：$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: 生成签名密钥库
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cktv-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cktv-release.keystore" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: 导入签名密钥
        run: |
          # 密钥库密码和密钥密码都是公开的，密钥本身没有保密价值，
          # 只是用来证明安装包是 CKTV 官方构建的。
          # 密钥库文件在上一步已经生成，这里只把密码写进 Tauri 的配置文件。
          # 注意：Tauri 只认 ANDROID_KEY_ALIAS 和 ANDROID_KEY_PASSWORD 这两个环境变量，
          # 不认 ANDROID_KEYSTORE_PASSWORD，所以两个密码都要写进 ANDROID_KEY_PASSWORD。
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 安装依赖并构建 APK
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri android init || true
          pnpm tauri android build
      - name: 上传 APK 到草稿 Release
        run: |
          find client/src-tauri/gen/android -name '*.apk' -print -exec gh release upload "$GITHUB_REF_NAME" {} --clobber \;
  ios:
    name: iOS 构建
    runs-on: macos-latest
    needs: verify
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: 安装依赖并初始化 iOS 工程
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri ios init || true
      - name: 编译未签名的 App
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
        run: pnpm tauri ios build
      - name: 打包 IPA 并上传到草稿 Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IPA_OUT="$RUNNER_TEMP/CKTV_${VERSION}_ios-unsigned.ipa"
          IPA=$(find src-tauri -name '*.ipa' | head -n 1)
          if [ -n "$IPA" ]; then
            echo "tauri 已生成 IPA：$IPA"
            cp "$IPA" "$IPA_OUT"
          else
            APP=$(find src-tauri -name '*.app' -type d | head -n 1)
            if [ -z "$APP" ]; then
              echo "没有找到编译好的 .app 或 .ipa" >&2
              exit 1
            fi
            echo "tauri 已生成 .app：$APP，打包成 IPA"
            rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qry "$IPA_OUT" Payload)
          fi
          gh release upload "$GITHUB_REF_NAME" "$IPA_OUT" --clobber
  publish:
    name: 生成更新清单并正式发布
    runs-on: ubuntu-latest
    needs: [desktop, android, ios]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 生成 update.json 和 altstore.json
        run: |
          # 资产已经在草稿 Release 里，这里只下载，不重新构建。
          # 下载失败（比如资产还没上传完）时直接失败，不能生成空清单。
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/assets" --pattern '*'
          node client/scripts/make-update-manifest.mjs \
            --tag "$GITHUB_REF_NAME" \
            --assets "$RUNNER_TEMP/assets" \
            --out "$RUNNER_TEMP/manifests" \
            --cn-mirror "${{ vars.CN_MIRROR_BASE }}" \
            --allow-mirror-hosts-file client/scripts/allow-mirror-hosts.txt
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/manifests/update.json" "$RUNNER_TEMP/manifests/altstore.json" --clobber
      - name: 把 Release 改为正式发布
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
